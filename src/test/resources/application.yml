spring:
  datasource:
    url: jdbc:h2:mem:shortlink;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  base-url: http://localhost:8080
  jwt:
    secret: test-only-jwt-secret-value-not-used-in-production-32bytes+
    expiration-minutes: 60
  rate-limit:
    window-seconds: 2
    anonymous-limit: 3
    authenticated-limit: 5
