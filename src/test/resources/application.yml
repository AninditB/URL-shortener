spring:
  datasource:
    url: jdbc:h2:mem:shortlink;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
      auto-create: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  base-url: http://localhost:8080
  jwt:
    secret: test-only-jwt-secret-value-not-used-in-production-32bytes+
    expiration-minutes: 60
  rate-limit:
    window-seconds: 2
    anonymous-limit: 3
    authenticated-limit: 5
  idempotency:
    ttl-hours: 24
  # GeoCountryResolver is unit-tested with a mocked DatabaseReader (see GeoCountryResolverTest);
  # this path is never actually opened because GeoIpConfig's DatabaseReader bean is @Lazy and
  # nothing calls a real lookup yet (that lands in ticket 4).
  geoip:
    database-path: not-configured-in-tests.mmdb
  analytics:
    dedup-ttl-days: 7
  cors:
    allowed-origin: http://localhost:5500
