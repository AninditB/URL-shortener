server:
  port: 8080

spring:
  application:
    name: shortlink
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shortlink}
    username: ${SPRING_DATASOURCE_USERNAME:shortlink}
    password: ${SPRING_DATASOURCE_PASSWORD:shortlink}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
  rate-limit:
    window-seconds: ${APP_RATE_LIMIT_WINDOW_SECONDS:60}
    anonymous-limit: ${APP_RATE_LIMIT_ANONYMOUS_LIMIT:10}
    authenticated-limit: ${APP_RATE_LIMIT_AUTHENTICATED_LIMIT:100}
  idempotency:
    ttl-hours: ${APP_IDEMPOTENCY_TTL_HOURS:24}
  geoip:
    database-path: ${APP_GEOIP_DATABASE_PATH}
  analytics:
    dedup-ttl-days: ${APP_ANALYTICS_DEDUP_TTL_DAYS:7}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5500}
