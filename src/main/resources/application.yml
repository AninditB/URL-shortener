server:
  port: 8080

spring:
  application:
    name: shortlink
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shortlink}
    username: ${SPRING_DATASOURCE_USERNAME:shortlink}
    password: ${SPRING_DATASOURCE_PASSWORD:shortlink}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
