services:
  postgres:
    image: postgres:16
    container_name: shortlink-postgres
    environment:
      POSTGRES_DB: shortlink
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
    ports:
      - "5432:5432"
    volumes:
      - shortlink-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: shortlink-redis
    ports:
      - "6379:6379"

volumes:
  shortlink-postgres-data:
